services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: reorder
      POSTGRES_PASSWORD: reorder
      POSTGRES_DB: reorder
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # TCP on purpose: during first-time setup Postgres listens on its socket only.
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "reorder", "-d", "reorder"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
