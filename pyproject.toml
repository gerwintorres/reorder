[project]
name = "reorder"
version = "0.1.0"
description = "Weekly demand estimation per product from sales history, with the rule and inputs behind each estimate."
readme = "README.md"
authors = [
    { name = "gerwintorres", email = "ger.lamto@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "A", "BLE"]

[tool.ruff.lint.isort]
# The migrations folder is also named alembic; this is the installed package.
known-third-party = ["alembic"]

[tool.mypy]
files = ["src"]
strict = true
